<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Очистка кэша - PM Simulator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #fdf4ff 0%, #f5e6ff 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #a855f7;
            margin-bottom: 20px;
        }
        button {
            background: #a855f7;
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px;
            transition: all 0.2s;
        }
        button:hover {
            background: #9333ea;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        .success {
            color: #10b981;
            margin-top: 20px;
            font-weight: 600;
        }
        .info {
            color: #64748b;
            margin: 20px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Очистка кэша</h1>
        <p class="info">Если платформа зависает при загрузке, используйте эту страницу для очистки локальных данных.</p>
        
        <button onclick="clearAll()">Очистить всё</button>
        <button onclick="clearAuthOnly()">Очистить только авторизацию</button>
        
        <div id="result"></div>
        
        <p class="info" style="margin-top: 30px;">
            <a href="/" style="color: #a855f7; text-decoration: none;">← Вернуться на платформу</a>
        </p>
    </div>

    <script>
        function clearAll() {
            try {
                // Очищаем весь localStorage
                localStorage.clear();
                
                // Очищаем sessionStorage
                sessionStorage.clear();
                
                // Очищаем cookies
                document.cookie.split(";").forEach(function(c) { 
                    document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/"); 
                });
                
                document.getElementById('result').innerHTML = 
                    '<p class="success">✅ Все данные очищены!<br>Перенаправление...</p>';
                
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    '<p style="color: red;">❌ Ошибка: ' + error.message + '</p>';
            }
        }
        
        function clearAuthOnly() {
            try {
                // Очищаем только данные аутентификации
                const keysToRemove = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && (key.includes('auth') || key.includes('supabase'))) {
                        keysToRemove.push(key);
                    }
                }
                
                keysToRemove.forEach(key => localStorage.removeItem(key));
                
                document.getElementById('result').innerHTML = 
                    '<p class="success">✅ Данные авторизации очищены!<br>Перенаправление...</p>';
                
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    '<p style="color: red;">❌ Ошибка: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
