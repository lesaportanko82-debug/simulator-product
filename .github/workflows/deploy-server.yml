# Деплой серверных функций в Supabase-проект pm-simulator (arwqiyvtvajgfpdnstsu).
# Нужен секрет репозитория SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
# Без секрета шаг пропускается, workflow не падает.
name: Deploy server functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: arwqiyvtvajgfpdnstsu
    steps:
      - uses: actions/checkout@v4
      - name: Нет токена — пропускаем
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::warning::Секрет SUPABASE_ACCESS_TOKEN не задан — функции не задеплоены."
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: 2.122.0
      - name: Деплой функций
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          for fn in make-server-0610b5e4 start-simulator-trial create-simulator-yookassa-payment simulator-yookassa-webhook; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api --yes
          done
